appId: app.postconet.studio
productName: PostConet API Studio
copyright: Copyright © PostConet
directories:
  output: release
  buildResources: resources
icon: icon.icns
files:
  - out/**/*
  - package.json
  - node_modules/undici/**/*
asar: true
extraResources:
  - from: resources/icon.png
    to: icon.png
mac:
  icon: icon.icns
  artifactName: PostConet-API-Studio-${version}-${arch}.${ext}
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  notarize: false
win:
  icon: icon.png
  artifactName: PostConet-API-Studio-Setup-${version}-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PostConet API Studio
  uninstallDisplayName: PostConet API Studio
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: jawadbayg
  repo: postconet
  releaseType: release
extraMetadata:
  main: out/main/index.js
